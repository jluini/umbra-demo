<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umbra</title>
  <style>
    [data-widget] {
      border: 1px solid black;
      padding: 8px;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div data-widget="languages"></div>
    <div data-widget="mission"></div>
    <div data-widget="inventory"></div>
    <div data-widget="actors"></div>
    <div data-widget="locations"></div>
    <div data-widget="clock"></div>
    <div data-widget="analog_clock"></div>
  </div>

  <script src="../umbra/umbra.js"></script>
  <script src="../presentation/i18n.js"></script>
  <script src="../games/demo.js"></script>

  <script>
    (() => {
      const games = { demo: Demo };
      const params = new URLSearchParams(window.location.search);
      const name = params.get("game") || "demo";
      const Game = games[name];
      if (!Game) { console.error("umbra: unknown game: " + name); return; }

      // const game = Game.create();
      // Renderer.create({ root: document.getElementById("app") }).connect(game);
      // game.start();

      window.game = Game;
    })();
  </script>

  <script src="script.js"></script>
</body>
</html>
