<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umbra</title>
  <style>
    [data-widget] {
      border: 1px solid black;
      padding: 8px;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div data-widget="languages"></div>
    <div data-widget="mission"></div>
    <div data-widget="actors"></div>
    <div data-widget="clock"></div>
  </div>

  <script src="umbra/umbra.js"></script>
  <script src="games/demo.js"></script>
  <script src="games/rockers.js"></script>
  <script src="renderer.js"></script>
  <script>
    (() => {
      const games = { demo: Demo, rockers: Rockers };
      const params = new URLSearchParams(window.location.search);
      const name = params.get("game") || "demo";
      const Game = games[name];
      if (!Game) { console.error("umbra: unknown game: " + name); return; }
      const game = Game.create();
      Renderer.create({ root: document.getElementById("app") }).connect(game);
      game.start();
    })();
  </script>
</body>
</html>
